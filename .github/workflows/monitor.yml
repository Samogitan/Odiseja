name: Odyssey IMAX Showtime Monitor

on:
  schedule:
    # Runs once daily at 06:00 UTC = 09:00 Vilnius time (EEST, summer).
    # Adjust the hour if you want it earlier/later, or add more entries
    # to the list to run more than once a day.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Pythonåå
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py
